<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agent App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .chat-container { border: 1px solid #ccc; padding: 20px; height: 400px; overflow-y: scroll; margin-bottom: 20px; background: #f9f9f9; border-radius: 8px;}
        .message { margin-bottom: 12px; padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .agent { background: #e9ecef; color: black; margin-right: auto; text-align: left; }
        .system { color: #888; font-size: 0.9em; font-style: italic; text-align: center; margin: 5px auto;}
        
        #input-container { display: flex; gap: 10px; }
        #message-input { flex-grow: 1; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 4px; border: none; background: #007bff; color: white; font-weight: bold;}
        button:hover { background: #0056b3; }
        
        #hitl-container { margin-top: 20px; border: 2px solid #28a745; padding: 15px; display: none; border-radius: 8px; background: #e8f5e9;}
        #reject-form { margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <h1>AI Travel Agent</h1>
    
    <div id="messages-container" class="chat-container"></div>
    
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Chat with your agent..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <div id="hitl-container">
        <h3>🗺️ Proposed Itinerary Ready!</h3>
        <p><strong>Destination:</strong> <span id="hitl-destination"></span></p>
        <p><strong>Weather:</strong> <span id="hitl-weather"></span></p>
        <ul id="hitl-itinerary"></ul>
        <button id="approve-btn" style="background: #28a745;">Approve & Book</button>
        <button id="reject-init-btn" style="background: #dc3545; margin-left: 10px;">Request Changes</button>
        
        <div id="reject-form">
            <input type="text" id="feedback-input" placeholder="What should be changed?" style="width: 250px; padding: 5px;">
            <button id="reject-submit-btn" style="background: #dc3545;">Submit Changes</button>
        </div>
    </div>

    <script>
        let ws = null;
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const hitlContainer = document.getElementById('hitl-container');

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (role === 'system') {
                div.innerHTML = `<em>${content}</em>`;
            } else {
                div.innerHTML = `<strong>${role === 'user' ? 'You' : 'Agent'}:</strong> ${content}`;
            }
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/agent`;
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                appendMessage('system', 'Connected to Agent. Say hello!');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);

                if (data.node === 'chat_response') {
                    appendMessage('agent', data.message);
                } else if (data.node === 'system_event') {
                    appendMessage('system', data.message);
                } else if (data.node === 'hitl') {
                    hitlContainer.style.display = 'block';
                    document.getElementById('input-container').style.display = 'none';
                    
                    const state = data.state;
                    document.getElementById('hitl-destination').innerText = state.constraints?.destination || '';
                    document.getElementById('hitl-weather').innerText = state.weather_data?.temperature ? `${state.weather_data.temperature}°C` : 'N/A';
                    
                    const ul = document.getElementById('hitl-itinerary');
                    ul.innerHTML = '';
                    if (state.itinerary) {
                        state.itinerary.forEach(item => {
                            const li = document.createElement('li');
                            const cost = item.details?.price_per_night ? `($${item.details.price_per_night}/night)` : '';
                            li.innerText = `${item.day} - [${item.type}] ${item.details?.name} ${cost}`;
                            ul.appendChild(li);
                        });
                    }
                } else if (data.node === 'end') {
                    appendMessage('agent', `🎉 Bookings confirmed! Confirmation code: ${data.state.booking_confirmation}`);
                    hitlContainer.style.display = 'none';
                    document.getElementById('input-container').style.display = 'flex';
                }
            };

            ws.onclose = () => {
                appendMessage('system', 'Disconnected. Please refresh.');
            };
        }

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (!msg || !ws) return;
            
            appendMessage('user', msg);
            ws.send(JSON.stringify({ action: "chat", message: msg }));
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // HITL Handlers
        document.getElementById('approve-btn').addEventListener('click', () => {
            ws.send(JSON.stringify({ action: "approve" }));
            hitlContainer.style.display = 'none';
            document.getElementById('input-container').style.display = 'flex';
            appendMessage('user', 'Approved itinerary.');
        });

        document.getElementById('reject-init-btn').addEventListener('click', () => {
            document.getElementById('reject-form').style.display = 'block';
        });

        document.getElementById('reject-submit-btn').addEventListener('click', () => {
            const feedback = document.getElementById('feedback-input').value.trim();
            if (!feedback) return;
            
            ws.send(JSON.stringify({ action: "reject", feedback: feedback }));
            
            hitlContainer.style.display = 'none';
            document.getElementById('reject-form').style.display = 'none';
            document.getElementById('input-container').style.display = 'flex';
            document.getElementById('feedback-input').value = '';
            
            appendMessage('user', `Requested Changes: ${feedback}`);
        });

        // Initialize connection
        connect();
    </script>
</body>
</html>
